addr: "0.0.0.0:${ROUTEX_HTTP_PORT:-9000}"

# Database driver: "postgres" (default) or "mysql"
driver: postgres
dsn: "host=localhost port=5432 user=postgres password=postgres dbname=routex sslmode=disable"

# Environment variables are supported:
# dsn: "${DATABASE_URL:-host=localhost port=5432 user=postgres password=postgres dbname=routex sslmode=disable}"

# MySQL example:
# driver: mysql
# dsn: "root:password@tcp(localhost:3306)/routex?charset=utf8mb4&parseTime=True&loc=Local"
