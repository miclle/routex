addr: "0.0.0.0:${ROUTEX_HTTP_PORT:-9000}"

# Database driver: "postgres" (default) or "mysql"
driver: "${ROUTEX_DB_DRIVER:-postgres}"
dsn: "${DATABASE_URL:-host=127.0.0.1 port=15433 user=routex password=routex-local dbname=routex sslmode=disable}"

# Required to store upstream credentials. Generate once: openssl rand -base64 32
# Keep the key outside the database and preserve it across restarts/backups.
encryption_key: "${ROUTEX_ENCRYPTION_KEY}"
# Durable call-event buffer. Relative paths resolve against this config's directory.
# Keep its directory on a persistent writable volume; one running process per file.
event_queue_path: "${ROUTEX_EVENT_QUEUE_PATH:-data/calls.db}"
# Forwarding headers are ignored unless the direct peer is explicitly trusted.
# Example: trusted_proxies: ["${ROUTEX_TRUSTED_PROXY:-10.0.0.0/8}"]
# Trust only the actual reverse proxy networks; an empty list is the safe default.
trusted_proxies: []
# Explicit opt-in for private/self-hosted upstreams; false by default.
allow_private_upstreams: "${ROUTEX_ALLOW_PRIVATE_UPSTREAMS:-false}"
# Independent opt-in for private/localhost proxy endpoints; target policy is unchanged.
allow_private_egresses: "${ROUTEX_ALLOW_PRIVATE_EGRESSES:-false}"

# Defaults match `go tool task db:up`; credentials are for local development only.
# Set DATABASE_URL when using another database or a custom Compose host port.
# MySQL: run `go tool task db:mysql`, then set:
# ROUTEX_DB_DRIVER=mysql
# DATABASE_URL='routex:routex-local@tcp(127.0.0.1:13306)/routex?charset=utf8mb4&parseTime=True&loc=UTC'

# Independently permit trusted private SMTP hosts; never enables plaintext AUTH.
allow_private_smtp: "${ROUTEX_ALLOW_PRIVATE_SMTP:-false}"

# Independently permit trusted private S3-compatible endpoints.
allow_private_storage: "${ROUTEX_ALLOW_PRIVATE_STORAGE:-false}"
